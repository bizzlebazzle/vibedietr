name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: root-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: ci
      DB_PASSWORD: ci-password
      MAIL_MAILER: array

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, fileinfo, pdo_mysql, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Locate the Composer download cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Install Composer dependencies from the lock file
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Configure the application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Confirm MySQL is ready
        run: >-
          php -r 'new PDO(
          "mysql:host=".getenv("DB_HOST").";port=".getenv("DB_PORT").";dbname=".getenv("DB_DATABASE"),
          getenv("DB_USERNAME"), getenv("DB_PASSWORD")
          );'

      - name: Run database migrations
        run: php artisan migrate --force --ansi

      - name: Run backend tests
        run: composer test

      - name: Validate cached production configuration
        env:
          APP_ENV: production
          APP_DEBUG: 'false'
          APP_KEY: base64:a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
          APP_URL: https://app.example.com
          SESSION_SECURE_COOKIE: 'true'
          SESSION_HTTP_ONLY: 'true'
          SESSION_SAME_SITE: lax
          TRUSTED_HOSTS: app.example.com
          TRUSTED_PROXIES: none
          TRUSTED_PROXY_HEADERS: x-forwarded-for,x-forwarded-host,x-forwarded-port,x-forwarded-proto
          FILESYSTEM_DISK: s3
          PRODUCTION_DURABLE_DISK: s3
          AWS_ACCESS_KEY_ID: synthetic-storage-key
          AWS_SECRET_ACCESS_KEY: synthetic-storage-secret
          AWS_DEFAULT_REGION: eu-west-2
          AWS_BUCKET: synthetic-private-bucket
          ADMIN_SECURITY_FINGERPRINT_KEY: synthetic-fingerprint-secret
          ADMIN_TOTP_ENABLED: 'true'
          ADMIN_TOTP_ISSUER: VibeDietr
          ADMIN_PASSWORD_ONLY_FALLBACK: 'false'
          ADMIN_SECURITY_MAILER: smtp
          ADMIN_SECURITY_PROVIDER: synthetic-smtp
          ADMIN_SECURITY_SENDER_VERIFIED: 'true'
          ADMIN_SECURITY_QUEUE: security-notifications
          DB_QUEUE_RETRY_AFTER: '90'
          QUEUE_OPERATIONS_ENABLED: 'true'
          QUEUE_SUPERVISION: container
          QUEUE_SCHEDULER_ENABLED: 'true'
          APP_INSTANCE: ci-production-smoke
          OBSERVABILITY_ADAPTER: platform
          OBSERVABILITY_RELEASE: ci-production-smoke
          MAIL_MAILER: smtp
          MAIL_SCHEME: tls
          MAIL_HOST: smtp.example.com
          MAIL_PORT: 587
          MAIL_USERNAME: synthetic-mail-user
          MAIL_PASSWORD: synthetic-mail-secret
          MAIL_FROM_ADDRESS: security@example.com
          OPENFOODFACTS_USER_AGENT: VibeDietr/ci (https://app.example.com/contact)
        run: |
          php artisan config:cache
          php artisan app:production-check
          php artisan config:clear

  php-formatting:
    name: PHP formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, fileinfo, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Locate the Composer download cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Install Composer dependencies from the lock file
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check PHP formatting
        run: vendor/bin/pint --test

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, fileinfo, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Locate the Composer download cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Install Composer dependencies from the lock file
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run static analysis
        run: composer analyse

      - name: Prove static-analysis failures are blocking
        run: composer analyse:failure-regression

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.18'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies from the lock file
        run: npm ci

      - name: Validate the development environment
        run: npm run env:check

      - name: Validate the Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Run frontend scanner tests
        run: npm run test:scanner

      - name: Validate documentation
        run: npm run docs:check

      - name: Prove documentation-validation failures are blocking
        run: npm run docs:test

      - name: Build frontend assets
        run: npm run build
